<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
    <h1>Forms</h1>

<div>
    <br action="welcomePage.html" target="_blank">

    <fieldset>
        <legend>Enter Your Basic Information</legend>
        <label for="full Name">Full Name : </label>
        <input type="text" id="Full Name" placeholder="Enter Your Name" required>

        <br><br>
        <label for="email">Email : </label>
        <input type="email" id="Email" placeholder="Enter Your Email" required>

        <br></br>
        <label for="Password">Password : </label>
        <input type="password" id="Password" placeholder="Enter Your Password" required min="0" max="9">

        <br></br>
        <label for="Checkbox"> Are You 18+? : </label>
        <input type="Checkbox" id="Checkbox" required>

        <br></br>
        <label for="phonenumber"> Enter Your Phone Number : </label>
        <input type="number" id="phonenumber" required min="0" max="9">

        <br></br>
        <label for="Gender"> Gender : </label>
        <label for="Male"> male : </label>
        <input type="radio" id="Male" name="gender">
        <label for="Female"> female : </label>
        <input type="radio" id="Female" name="gender">

        <br></br>
        <label for="date"> Enter Your DOB : </label>
        <input type="date" id="date" required>

        <br></br>
        <label for="file"> Upload Photo: </label>
        <input type="file" id="file" required>

        <br></br>
        <label for="city"> Select Your City: </label>
        <select name="city" id="city">
            <option value="delhi">Delhi</option>
            <option value="mumbai">Mumbai</option>
            <option value="noida">Noida</option>
            <option value="kolkata">Kolkata</option>
            <option value="jaipur">Jaipur</option>
        </select>

        <br></br>
        <button type="submit"> Submit Form </button>

        </form>
    </fieldset>
</div>
</body>

</html>
