<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Novell Servie Login</h1>
   <!-- Simple Form -->
    <form action="">
        <label for="Username">Username: </label>
        <input type="text" id="Username" name="username" required>

        <br><br>
        <label for="Password">Password: </label>
        <input type="Password" id="Password" name="password" required>

        <br></br>
        <label for="City">City Of Employment: </label>
        <input type="text" id="City" name="city" required>

        <br></br>
        <label for="Server">Web Server: </label>
        <select id="Server" name="Server" required>
            <option value="">Choose a server</option>
            <option value="">Server 1</option>
            <option value="">Server 2</option>
            <option value="">Server 3</option>
        </select>

        <br></br>
        <label for="Role">Please Specify Your Role :</label>
        <br></br>
        <input type="radio" id="Admin" name="Role">
        <label for="Admin"> Admin </label>
        <br></br>
        <input type="radio" id="Engineer" name="Role">
        <label for="Engineer"> Engineer </label>
        <br></br>
        <input type="radio" id="Manager" name="Role">
        <label for="Manager"> Manager </label>
        <br></br>
        <input type="radio" id="Guest" name="Role">
        <label for="Guest"> Guest </label>

        <br></br>
        <label for="Sinle Sign-on">Sinle Sign-on to the following:</label>
        <br></br>
        <input type="radio" id="Mail" name="Role">
        <label for="Mail"> Mail </label>
        <br></br>
        <input type="radio" id="Payroll" name="Role">
        <label for="Payroll"> Payroll </label>
        <br></br>
        <input type="radio" id="Self-service" name="Role">
        <label for="Self-service"> Self-service </label>

        <br></br>
        <button type="Login"> Login </button>
        <button type="Reset"> Reset </button>
    </form>
    
<!-- Using Table -->
 <br></br>

            <td> <input type="text" id="City" name="city" required></td>

            <option value="">Choose a server</option>
            <option value="">Server 1</option>
            <option value="">Server 2</option>
            <option value="">Server 3</option></td>
        </tr>
        <tr>
            <td><label for="Role">Please Specify Your Role :</label></td>
            <td><input type="radio" id="Admin" name="Role">
        <label for="Admin"> Admin </label>
        <br>
        <input type="radio" id="Engineer" name="Role">
        <label for="Engineer"> Engineer </label>
        <br>
        <input type="radio" id="Manager" name="Role">
        <label for="Manager"> Manager </label>
        <br>
        <input type="radio" id="Guest" name="Role">
        <label for="Guest"> Guest </label></td>
        </tr>
        <tr>
            <td><label for="Sinle Sign-on">Sinle Sign-on to the following:</label></td>
            <td><input type="checkbox" id="Mail" name="Role">
        <label for="Mail"> Mail </label>
        <br>
        <input type="checkbox" id="Payroll" name="Role">

        <input type="checkbox" id="Self-service" name="Role">
        <label for="Self-service"> Self-service </label>

        </tr>

     </table>
</div>
