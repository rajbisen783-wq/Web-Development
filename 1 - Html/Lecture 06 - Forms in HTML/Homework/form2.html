<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <div>
        <h1>Lecture 06 Forms 3rd Homework</h1>
        <br>
        <br action="aTag.html">
        <h1 style="text-align: center;">Pete's Pizza Delivery</h1>
        <h2 style="text-align: center;">Online Order Form</h2>
        <p style="text-align: center;">* required fields</p>
        <form>
            <fieldset>
                <legend>Customer Details</legend>
                <label for="Name">*Name: </label>
                <input type="text" id="*Name" required>

                <br><br>
                <label for="Address">*Address: </label>
                <input type="text" id="Address" required>

                <br></br>
                <label for="Town/City">*Town/City: </label>
                <input type="City Of Employment" id="Town/City" required>

                <br></br>
                <label for="Postcode">*Postcode: </label>
                <input type="Postcode" id="Postcode" required>

                <br></br>
                <label for="Tel">*Tel: </label>
                <input type="Tel" id="Tel" required>

                <br></br>
                <label for="email"> *Email: </label>
                <input type="email" id="Email" required>
            </fieldset>
            <fieldset>
                <legend>Topping*</legend>
                <input type="radio" id="Margherita" name="Topping">
                <label for="Margherita"> Margherita </label>
                <input type="radio" id="Four Seasons" name="Topping">
                <label for="Four Seasons"> Four Seasons </label>
                <input type="radio" id="Meat Feast" name="Topping">
                <label for="Meat Feast"> Meat Feast </label>
            </fieldset>
            <fieldset>
                <legend>Size*</legend>
                <input type="radio" id="Small" name="Size">
                <label for="Small"> Small </label>
                <input type="radio" id="Medium" name="Size">
                <label for="Medium"> Medium </label>
                <input type="radio" id="Large" name="Size">
                <label for="Large"> Large </label>
            </fieldset>
            <fieldset>
                <legend>Extras*</legend>
                <input type="radio" id="Mushrooms" name="Extras">
                <label for="Mushrooms"> Mushrooms </label>
                <input type="radio" id="Green Pappers" name="Extras">
                <label for="Green Pappers"> Green Pappers </label>
                <input type="radio" id="Anchovies" name="Extras">
                <label for="Anchovies"> Anchovies </label>
                <input type="radio" id="Extra Cheese" name="Extras">
                <label for="Extra Cheese"> Extra Cheese </label>
            </fieldset>
            <fieldset>
                <legend>Delivery</legend>
                <label for="time">Preferred delivery time: </label>
                <input type="time" id="time" required>
                <br>
                <br>
                <label for="Delivery instructions">Delivery instructions: </label>
                <br>
                <input type="Delivery instructions" id="Delivery instructions" required>
                <br></br>
                <button type="Submit" style="text-align: center;"> Submit Order </button>
            </fieldset>
        </form>
